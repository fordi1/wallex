[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wallex-ai-engine"
version = "0.1.0"
description = "Fail-closed spot trading engine for Wallex"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jdatetime>=5.0,<6",
  "numpy>=2.1,<3",
  "openai>=1.57,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=18,<23",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "streamlit>=1.40,<2",
  "uvicorn>=0.32,<1",
  "websockets>=14,<17",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.22,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wallex_engine"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

