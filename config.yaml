app:
  environment: local
  timezone: Asia/Tehran
  data_dir: ./data
  logs_dir: ./logs
  reports_dir: ./reports

challenge:
  # Provisional: replace with the official Wallex challenge allowlist before shadow/live.
  allowed_markets: [BTCTMN, ETHTMN, USDTTMN]
  starts_at: null
  ends_at: null
  initial_capital_tmn: "5000000"

exchange:
  rest_url: https://api.wallex.ir
  websocket_url: wss://api.wallex.ir/ws
  request_timeout_seconds: 10
  max_retries: 3

strategy:
  signal_timeframe_minutes: 5
  trend_timeframe_minutes: 60
  max_spread_bps: "25"
  volume_z_min: "0"
  safety_factor: "1.5"
  stop_atr: "1.5"
  trend_target_r: "3"  # best in-sample in reports/param_sweep.json
  time_stop_bars: 12

risk:
  risk_per_trade: "0.01"
  max_symbol_exposure: "0.20"
  max_total_exposure: "0.60"
  min_tmn_reserve: "0.40"
  max_positions: 3
  min_hold_minutes: 10
  cooldown_minutes: 15
  loss_cooldown_minutes: 60
  daily_loss_stop: "0.03"
  halve_size_drawdown: "0.06"
  kill_switch_drawdown: "0.10"

execution:
  entry_timeout_seconds: 20
  max_reprice_attempts: 2
  modeled_slippage_bps: "8"
  reconcile_interval_seconds: 60
  canary: true
  canary_max_positions: 1
  canary_symbol_exposure: "0.05"
  canary_total_exposure: "0.15"
  canary_risk_per_trade: "0.0025"

ai:
  enabled: true
  provider: boxapi
  model: openai/gpt-6-luna
  # The key remains in BOX_API_KEY; this non-secret endpoint is safe to commit.
  base_url: https://ai.boxapi.ir/ai/v1
  timeout_seconds: 12
  temperature: 0
  seed: 42
  prompt_version: regime-v1
  schema_version: decisions-v1
  fallback_size_multiplier: "0.50"

backtest:
  start: "2026-10-15T00:00:00+03:30"
  end: "2026-10-22T00:00:00+03:30"
  walk_forward_train_days: 60
  walk_forward_test_days: 14

dashboard:
  refresh_seconds: 30

