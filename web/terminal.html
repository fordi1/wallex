<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ترمینال Wallex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #131722; --panel: #1e222d; --panel-2: #262b38; --border: #2a2e39;
    --text: #d1d4dc; --muted: #868993; --up: #089981; --down: #f23645;
    --accent: #2962ff; --warn: #f0b90b; --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 Vazirmatn, Tahoma, sans-serif; overflow-x: hidden;
  }
  button, select, input { font: inherit; color: inherit; }
  button {
    min-height: 44px; white-space: nowrap; cursor: pointer; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--panel-2); padding: 0 14px;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button[disabled] { opacity: .45; cursor: not-allowed; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .danger { background: var(--down); border-color: var(--down); color: #fff; }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .up { color: var(--up); } .down { color: var(--down); } .muted { color: var(--muted); }

  .app { display: grid; min-height: 100vh; grid-template-rows: auto auto 1fr auto;
    grid-template-columns: minmax(0, 1fr) 300px;
    grid-template-areas: "top top" "modes modes" "chart side" "bottom side"; }
  .top { grid-area: top; display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
  .top .grow { flex: 1 1 160px; display: flex; align-items: center; gap: 12px; min-width: 0; }
  .symbol-select { min-height: 44px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 10px; font-weight: 700; }
  .price-big { font-size: 20px; font-weight: 700; }
  .group { display: flex; flex-wrap: wrap; gap: 4px; align-items: stretch; }
  .tf { min-width: 44px; padding: 0 8px; }
  .tf.on, .toggle.on { background: rgba(41,98,255,.18); border-color: var(--accent); color: #fff; }

  .modes { grid-area: modes; display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .mode-tabs { display: flex; gap: 4px; }
  .mode-tab { display: inline-flex; align-items: center; gap: 8px; }
  .mode-tab.selected { border-color: var(--accent); color: #fff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex: none; }
  .dot.run { background: var(--up); box-shadow: 0 0 0 3px rgba(8,153,129,.25); }
  .mode-status { flex: 1 1 220px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .mode-status .text { flex: 1 1 180px; min-width: 0; }

  .chart-wrap { grid-area: chart; position: relative; min-height: 420px; border-left: 1px solid var(--border); }
  #chart { position: absolute; inset: 0; direction: ltr; }
  .legend { position: absolute; top: 8px; right: 12px; z-index: 3; pointer-events: none;
    font-size: 13px; background: rgba(19,23,34,.7); padding: 2px 8px; border-radius: var(--radius); }

  .side { grid-area: side; background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-width: 0; }
  .section { border-bottom: 1px solid var(--border); padding: 10px 12px; }
  .section h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 0; }
  .watch { cursor: pointer; border-radius: var(--radius); padding: 6px 8px; margin: 0 -8px; }
  .watch.on { background: var(--panel-2); }
  .book .row { padding: 1px 0; font-size: 13px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; }
  .kv b { font-weight: 500; text-align: left; }

  .bottom { grid-area: bottom; border-top: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; height: 260px; min-width: 0; }
  .bottom-tabs { display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border); }
  .bottom-tabs button.on { border-color: var(--accent); color: #fff; }
  .table-wrap { overflow: auto; flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 12px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  td.reason { white-space: normal; min-width: 220px; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  tr.clickable { cursor: pointer; } tr.clickable:hover td { background: var(--panel-2); }
  .detail td { white-space: normal; color: var(--muted); background: var(--bg); }
  .badge { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; background: var(--panel-2); }

  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; width: min(460px, calc(100vw - 32px)); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  dialog h3 { margin: 0 0 12px; }
  dialog label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
  dialog select, dialog input { width: 100%; min-height: 44px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .reasons { margin: 8px 0 0; padding-right: 18px; color: var(--down); font-size: 13px; }
  .toast { position: fixed; bottom: 16px; left: 16px; right: 16px; margin: auto; max-width: 420px; z-index: 20;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; display: none; }

  @media (max-width: 900px) {
    .app { grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "top" "modes" "chart" "bottom" "side"; }
    .chart-wrap { min-height: 360px; border-left: 0; }
    .side { border-right: 0; }
  }
  @media (max-width: 480px) {
    .top, .modes { padding: 8px 16px; }
    .price-big { font-size: 17px; }
    .mode-tabs { flex: 1 1 100%; }
    .mode-tab { flex: 1 1 0; justify-content: center; padding: 0 6px; }
    .bottom { height: 320px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="grow">
      <select id="symbol" class="symbol-select ltr" aria-label="بازار"></select>
      <span id="last" class="price-big">—</span>
      <span id="change">—</span>
    </div>
    <div class="group" id="timeframes" role="group" aria-label="بازه زمانی"></div>
    <div class="group">
      <button class="toggle on" id="t-ema" aria-pressed="true">EMA ۹/۲۱</button>
      <button class="toggle on" id="t-vol" aria-pressed="true">حجم</button>
      <button id="open-settings" aria-label="تنظیمات">⚙ تنظیمات</button>
    </div>
  </header>

  <nav class="modes" aria-label="حالت اجرا">
    <div class="mode-tabs" role="tablist">
      <button class="mode-tab" role="tab" data-mode="backtest"><span class="dot"></span>بک‌تست</button>
      <button class="mode-tab" role="tab" data-mode="shadow"><span class="dot"></span>سایه</button>
      <button class="mode-tab" role="tab" data-mode="live"><span class="dot"></span>لایو</button>
    </div>
    <div class="mode-status">
      <div class="text" id="mode-text">در حال بارگیری وضعیت…</div>
      <button id="mode-action" class="primary">فعال‌سازی</button>
    </div>
  </nav>

  <main class="chart-wrap">
    <div class="legend" id="legend"></div>
    <div id="chart" aria-label="نمودار قیمت"></div>
  </main>

  <aside class="side">
    <section class="section"><h2>واچ‌لیست</h2><div id="watchlist"></div></section>
    <section class="section book"><h2>دفتر سفارش</h2><div id="book"></div></section>
    <section class="section"><h2>وضعیت موتور</h2><div class="kv" id="engine"></div></section>
  </aside>

  <section class="bottom">
    <div class="bottom-tabs" role="tablist">
      <button class="on" data-panel="signals">سیگنال‌ها</button>
      <button data-panel="prices">قیمت‌ها</button>
      <button data-panel="log">گزارش موتور</button>
    </div>
    <div class="table-wrap" id="panel"></div>
  </section>
</div>

<dialog id="settings">
  <h3>تنظیمات هوش مصنوعی</h3>
  <div class="muted" id="ai-provider"></div>
  <label for="model-select">مدل فعال</label>
  <select id="model-select" class="ltr"></select>
  <label for="model-new">افزودن مدل جدید</label>
  <input id="model-new" class="ltr" placeholder="provider/model-name" autocomplete="off">
  <p class="muted">موتور در اجرای بعدی از مدل ذخیره‌شده استفاده می‌کند.</p>
  <div class="actions">
    <button id="settings-cancel">انصراف</button>
    <button id="settings-save" class="primary">ذخیره</button>
  </div>
</dialog>

<dialog id="live-confirm">
  <h3>شروع معامله واقعی</h3>
  <p>الگوریتم با کلید API والکس و سرمایه واقعی، بدون دخالت دستی معامله می‌کند.</p>
  <label><input type="checkbox" id="live-check" style="width:auto;min-height:auto"> اجرای سایه را بررسی کرده‌ام و آماده‌ام.</label>
  <div class="actions">
    <button id="live-cancel">انصراف</button>
    <button id="live-go" class="danger" disabled>شروع لایو</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const FA = new Intl.NumberFormat("fa-IR", { maximumFractionDigits: 0 });
const FA2 = new Intl.NumberFormat("fa-IR", { maximumFractionDigits: 2 });
const FA6 = new Intl.NumberFormat("fa-IR", { maximumFractionDigits: 6 });
const TIME = new Intl.DateTimeFormat("fa-IR", { timeZone: "Asia/Tehran", hour: "2-digit", minute: "2-digit", hour12: false });
const DAY = new Intl.DateTimeFormat("fa-IR", { timeZone: "Asia/Tehran", month: "short", day: "numeric" });
const STAMP = new Intl.DateTimeFormat("fa-IR", { timeZone: "Asia/Tehran", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
const MODE = { backtest: "بک‌تست", shadow: "سایه", live: "لایو" };
const OUTCOME = { filled: "اجرا شد", skipped: "ورود نکرد", rejected: "رد شد" };
const TFS = [[1, "۱ دقیقه"], [5, "۵ دقیقه"], [15, "۱۵ دقیقه"], [60, "۱ ساعت"], [240, "۴ ساعت"], [1440, "روزانه"]];
const price = v => v == null ? "—" : (Math.abs(v) >= 100 ? FA : FA6).format(v);
const pct = v => v == null ? "—" : `${v > 0 ? "+" : ""}${FA2.format(v)}٪`;
const esc = s => String(s ?? "—").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);

const state = { symbol: null, tf: 15, ema: true, vol: true, mode: "shadow", engine: null, markets: null, panel: "signals", signals: [], open: new Set() };

async function api(path, options = {}) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw Object.assign(new Error("api"), { status: response.status, body });
  return body;
}
function toast(text) { const t = $("toast"); t.textContent = text; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 5000); }

// Chart
const chart = LightweightCharts.createChart($("chart"), {
  autoSize: true,
  layout: { background: { color: "#131722" }, textColor: "#d1d4dc", fontFamily: "Vazirmatn, Tahoma, sans-serif" },
  grid: { vertLines: { color: "#1f2430" }, horzLines: { color: "#1f2430" } },
  rightPriceScale: { borderColor: "#2a2e39" },
  timeScale: { borderColor: "#2a2e39", timeVisible: true, secondsVisible: false,
    tickMarkFormatter: (t, type) => (type <= 2 ? DAY : TIME).format(new Date(t * 1000)) },
  localization: { locale: "fa-IR", priceFormatter: price, timeFormatter: t => STAMP.format(new Date(t * 1000)) },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});
const candles = chart.addCandlestickSeries({ upColor: "#089981", downColor: "#f23645", borderVisible: false, wickUpColor: "#089981", wickDownColor: "#f23645" });
const volume = chart.addHistogramSeries({ priceScaleId: "", priceFormat: { type: "volume" }, lastValueVisible: false, priceLineVisible: false });
volume.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
const ema9 = chart.addLineSeries({ color: "#2962ff", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false });
const ema21 = chart.addLineSeries({ color: "#f0b90b", lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false });
let bars = [];
chart.subscribeCrosshairMove(p => {
  const bar = p && p.time ? bars.find(b => b.time === p.time) : bars[bars.length - 1];
  if (!bar) return;
  $("legend").innerHTML = `<span class="ltr">${esc(state.symbol)}</span> · باز ${price(bar.open)} · بیشینه ${price(bar.high)} · کمینه ${price(bar.low)} · بسته <b class="${bar.close >= bar.open ? "up" : "down"}">${price(bar.close)}</b>`;
});

async function loadCandles(fit = false) {
  if (!state.symbol) return;
  const data = await api(`/api/candles?symbol=${state.symbol}&tf=${state.tf}`);
  bars = data.candles;
  candles.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
  volume.setData(state.vol ? bars.map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? "rgba(8,153,129,.45)" : "rgba(242,54,69,.45)" })) : []);
  ema9.setData(state.ema ? bars.map(b => ({ time: b.time, value: b.ema9 })) : []);
  ema21.setData(state.ema ? bars.map(b => ({ time: b.time, value: b.ema21 })) : []);
  drawMarkers();
  if (fit) chart.timeScale().fitContent();
  if (bars.length) { const b = bars[bars.length - 1]; $("legend").innerHTML = `<span class="ltr">${esc(state.symbol)}</span> · بسته <b class="${b.close >= b.open ? "up" : "down"}">${price(b.close)}</b>`; }
}

let markers = [];
function drawMarkers() {
  if (!bars.length) return candles.setMarkers([]);
  const step = state.tf * 60, first = bars[0].time;
  const style = { entry: ["belowBar", "#089981", "arrowUp", "ورود"], exit: ["aboveBar", "#f23645", "arrowDown", "خروج"], vetoed: ["aboveBar", "#868993", "circle", "رد AI"] };
  candles.setMarkers(markers.filter(m => m.time >= first).map(m => {
    const [position, color, shape, text] = style[m.kind];
    return { time: Math.floor(m.time / step) * step, position, color, shape, text };
  }).sort((a, b) => a.time - b.time));
}

// Markets, watchlist, prices
async function loadMarkets() {
  state.markets = await api("/api/markets");
  const select = $("symbol");
  if (!select.options.length) {
    state.markets.symbols.forEach(s => select.add(new Option(s, s)));
    state.symbol = state.markets.symbols[0];
    select.value = state.symbol;
  }
  renderWatchlist(); renderTop();
  if (state.panel === "prices") renderPanel();
}
function renderTop() {
  const t = state.markets?.tickers[state.symbol];
  $("last").textContent = t ? price(t.last) : "—";
  $("change").innerHTML = t ? `<span class="${t.change_24h >= 0 ? "up" : "down"}">${pct(t.change_24h)}</span>` : "—";
}
function renderWatchlist() {
  $("watchlist").innerHTML = state.markets.symbols.map(s => {
    const t = state.markets.tickers[s];
    return `<div class="row watch ${s === state.symbol ? "on" : ""}" data-symbol="${esc(s)}" role="button" tabindex="0">
      <b class="ltr">${esc(s)}</b><span>${t ? price(t.last) : "—"}</span>
      <span class="${t && t.change_24h >= 0 ? "up" : "down"}">${t ? pct(t.change_24h) : "—"}</span></div>`;
  }).join("");
}
$("watchlist").addEventListener("click", e => { const row = e.target.closest("[data-symbol]"); if (row) selectSymbol(row.dataset.symbol); });
$("watchlist").addEventListener("keydown", e => { const row = e.target.closest("[data-symbol]"); if (row && e.key === "Enter") selectSymbol(row.dataset.symbol); });
$("symbol").addEventListener("change", e => selectSymbol(e.target.value));
function selectSymbol(symbol) { state.symbol = symbol; $("symbol").value = symbol; renderWatchlist(); renderTop(); refreshSymbol(true); }

async function loadBook() {
  if (!state.symbol) return;
  const book = await api(`/api/book?symbol=${state.symbol}`);
  const asks = book.asks.slice(0, 6).reverse(), bids = book.bids.slice(0, 6);
  const line = (l, cls) => `<div class="row"><span class="${cls}">${price(l[0])}</span><span class="muted">${FA6.format(l[1])}</span></div>`;
  const spread = asks.length && bids.length ? (asks[asks.length - 1][0] - bids[0][0]) / bids[0][0] * 100 : null;
  $("book").innerHTML = asks.map(l => line(l, "down")).join("") +
    `<div class="row muted"><span>اسپرد</span><span>${spread == null ? "—" : FA2.format(spread) + "٪"}</span></div>` +
    bids.map(l => line(l, "up")).join("");
}

async function loadSignals() {
  if (!state.symbol) return;
  const data = await api(`/api/signals?symbol=${state.symbol}`);
  markers = data.markers; state.signals = data.decisions;
  drawMarkers();
  if (state.panel === "signals") renderPanel();
}

// Bottom panel
document.querySelector(".bottom-tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.panel = b.dataset.panel;
  document.querySelectorAll(".bottom-tabs button").forEach(x => x.classList.toggle("on", x === b));
  renderPanel();
});
function renderPanel() {
  const panel = $("panel");
  if (state.panel === "prices") {
    const rows = (state.markets?.symbols || []).map(s => { const t = state.markets.tickers[s] || {};
      return `<tr><td class="ltr">${esc(s)}</td><td>${price(t.last)}</td><td class="${t.change_24h >= 0 ? "up" : "down"}">${pct(t.change_24h)}</td><td>${price(t.high_24h)}</td><td>${price(t.low_24h)}</td><td>${FA.format((t.volume_tmn || 0) / 1e9)} میلیارد</td></tr>`; }).join("");
    panel.innerHTML = `<table><thead><tr><th>بازار</th><th>آخرین قیمت</th><th>تغییر ۲۴ساعته</th><th>بیشینه</th><th>کمینه</th><th>حجم تومانی</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else if (state.panel === "log") {
    const log = state.engine?.running?.log || "موتوری در حال اجرا نیست.";
    panel.innerHTML = `<pre class="ltr" style="margin:0;padding:10px 12px;font-size:12px;white-space:pre-wrap">${esc(log)}</pre>`;
  } else {
    if (!state.signals.length) { panel.innerHTML = `<p class="muted" style="padding:10px 12px">هنوز تصمیم سایه یا لایو برای این بازار ثبت نشده است.</p>`; return; }
    panel.innerHTML = `<table><thead><tr><th>زمان</th><th>حالت</th><th>نتیجه</th><th>رژیم AI</th><th>دلیل</th></tr></thead><tbody>${state.signals.map((d, i) => {
      const cls = d.outcome === "filled" ? "up" : d.action && d.action !== "SKIP" ? "down" : "muted";
      const open = state.open.has(d.created_at);
      return `<tr class="clickable" data-i="${i}"><td>${STAMP.format(new Date(d.created_at))}</td><td><span class="badge">${MODE[d.mode] || esc(d.mode)}</span></td><td class="${cls}">${OUTCOME[d.outcome] || esc(d.outcome)}</td><td>${esc(d.ai_regime)}</td><td class="reason">${esc(d.reason_fa)}</td></tr>` +
        (open ? `<tr class="detail"><td colspan="5">قواعد: ${esc(d.signal_reason)}<br>رژیم AI: ${esc(d.ai_regime_reason)}<br>بازبینی AI: ${esc(d.ai_review_reason)}</td></tr>` : "");
    }).join("")}</tbody></table>`;
  }
}
$("panel").addEventListener("click", e => {
  const row = e.target.closest("tr.clickable"); if (!row) return;
  const key = state.signals[row.dataset.i].created_at;
  state.open.has(key) ? state.open.delete(key) : state.open.add(key);
  renderPanel();
});

// Engine and modes
document.querySelector(".mode-tabs").addEventListener("click", e => {
  const b = e.target.closest(".mode-tab"); if (!b) return;
  state.mode = b.dataset.mode; renderModes();
});
function renderModes() {
  const engine = state.engine; if (!engine) return;
  const running = engine.running;
  document.querySelectorAll(".mode-tab").forEach(b => {
    b.classList.toggle("selected", b.dataset.mode === state.mode);
    b.setAttribute("aria-selected", b.dataset.mode === state.mode);
    b.querySelector(".dot").classList.toggle("run", running?.mode === b.dataset.mode);
  });
  const action = $("mode-action"), text = $("mode-text"), gates = engine.gates[state.mode] || [];
  if (running && running.mode === state.mode) {
    text.innerHTML = `<span class="up">● ${MODE[state.mode]} در حال اجراست</span> <span class="muted">از ${STAMP.format(new Date(running.started_at))}</span>`;
    action.textContent = "توقف"; action.className = "danger"; action.disabled = false;
  } else if (running) {
    text.innerHTML = `<span class="muted">موتور در حالت «${MODE[running.mode]}» اجراست؛ برای این حالت ابتدا آن را متوقف کنید.</span>`;
    action.textContent = "فعال‌سازی"; action.className = "primary"; action.disabled = true;
  } else if (gates.length) {
    text.innerHTML = `<span class="down">قفل‌های باز نشده:</span> <span class="muted ltr">${gates.map(esc).join(" · ")}</span>`;
    action.textContent = "فعال‌سازی"; action.className = "primary"; action.disabled = true;
  } else {
    text.innerHTML = `<span class="muted">آماده اجرای ${MODE[state.mode]}</span>${state.mode === "live" && engine.canary ? ' <span class="badge">canary: حجم کوچک</span>' : ""}`;
    action.textContent = "فعال‌سازی"; action.className = state.mode === "live" ? "danger" : "primary"; action.disabled = false;
  }
}
$("mode-action").addEventListener("click", async () => {
  const running = state.engine?.running;
  if (running && running.mode === state.mode) {
    await api("/api/engine/stop", { method: "POST" }); toast("موتور متوقف شد."); return loadEngine();
  }
  if (state.mode === "live") { $("live-check").checked = false; $("live-go").disabled = true; return $("live-confirm").showModal(); }
  startMode(state.mode, false);
});
$("live-check").addEventListener("change", e => $("live-go").disabled = !e.target.checked);
$("live-cancel").addEventListener("click", () => $("live-confirm").close());
$("live-go").addEventListener("click", () => { $("live-confirm").close(); startMode("live", true); });
async function startMode(mode, confirm) {
  try { await api("/api/engine/start", { method: "POST", body: JSON.stringify({ mode, confirm_live: confirm }) }); toast(`${MODE[mode]} فعال شد.`); }
  catch (e) { const d = e.body?.detail; toast(Array.isArray(d) ? d.join(" · ") : (d || "شروع موتور ناموفق بود.")); }
  loadEngine();
}
async function loadEngine() {
  state.engine = await api("/api/engine");
  const e = state.engine, h = e.health;
  const left = e.ends_at ? Math.max(0, (new Date(e.ends_at) - Date.now()) / 3600000) : null;
  $("engine").innerHTML = `
    <span>حالت</span><b>${e.running ? MODE[e.running.mode] : "خاموش"}</b>
    <span>سلامت</span><b class="${h?.status === "ready" ? "up" : "muted"}">${h ? esc(h.detail || h.status) : "—"}</b>
    <span>ارزش سبد</span><b>${e.equity == null ? "—" : price(e.equity) + " تومان"}</b>
    <span>مدل AI</span><b class="ltr">${esc(e.ai.model)}</b>
    <span>زمان باقی‌مانده</span><b>${left == null ? "—" : FA2.format(left) + " ساعت"}</b>`;
  renderModes();
  if (state.panel === "log") renderPanel();
}

// Settings
$("open-settings").addEventListener("click", async () => {
  const s = await api("/api/settings");
  $("ai-provider").textContent = `ارائه‌دهنده: ${s.provider} · ${s.enabled ? "فعال" : "غیرفعال"}`;
  const select = $("model-select"); select.innerHTML = "";
  s.models.forEach(m => select.add(new Option(m, m, false, m === s.model)));
  $("model-new").value = ""; $("settings").showModal();
});
$("settings-cancel").addEventListener("click", () => $("settings").close());
$("settings-save").addEventListener("click", async () => {
  const model = $("model-new").value.trim() || $("model-select").value;
  try { await api("/api/settings", { method: "POST", body: JSON.stringify({ model }) }); $("settings").close(); toast(`مدل ${model} ذخیره شد.`); loadEngine(); }
  catch { toast("نام مدل معتبر نیست."); }
});

// Toolbar
$("timeframes").innerHTML = TFS.map(([v, l]) => `<button class="tf ${v === state.tf ? "on" : ""}" data-tf="${v}">${l}</button>`).join("");
$("timeframes").addEventListener("click", e => {
  const b = e.target.closest("[data-tf]"); if (!b) return;
  state.tf = Number(b.dataset.tf);
  document.querySelectorAll(".tf").forEach(x => x.classList.toggle("on", x === b));
  loadCandles(true);
});
for (const [id, key] of [["t-ema", "ema"], ["t-vol", "vol"]]) {
  $(id).addEventListener("click", e => { state[key] = !state[key]; e.target.classList.toggle("on", state[key]); e.target.setAttribute("aria-pressed", state[key]); loadCandles(); });
}

function refreshSymbol(fit) { loadCandles(fit).catch(() => toast("بارگیری نمودار ناموفق بود.")); loadBook().catch(() => {}); loadSignals().catch(() => {}); }
const every = (ms, fn) => setInterval(() => fn().catch(() => {}), ms);
(async () => {
  await Promise.all([loadMarkets(), loadEngine()]).catch(() => toast("اتصال به سرور ترمینال برقرار نشد."));
  refreshSymbol(true);
  every(10000, loadMarkets); every(5000, loadBook); every(30000, loadCandles); every(20000, loadSignals); every(5000, loadEngine);
})();
</script>
</body>
</html>
